<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Link</title>
<script>
  /* Terapkan tema tersimpan sebelum halaman tampil, supaya tidak berkedip */
  try { var t = localStorage.getItem('linkbio:theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme:light dark;
    --bg:#f7f6f4; --surface:#ffffff; --ink:#1f1f1e; --muted:#6b6a67;
    --line:rgba(0,0,0,.07);
    --bw:1px;
    --ring:linear-gradient(#ebe9e5,#ebe9e5);
    --shadow:0 1px 2px rgba(0,0,0,.04), 0 6px 22px rgba(0,0,0,.08);
  }
  :root[data-theme="light"] { color-scheme:light; }

  /* Dark: permukaan gelap, tepi gradient tipis, glow halus di kiri dan kanan (ditulis dua kali: otomatis dan manual) */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#09090c; --surface:#131318; --ink:#f2f2f5; --muted:#a5a5b0;
      --line:rgba(255,255,255,.10);
      --bw:1.5px;
      --ring:linear-gradient(100deg,#d45fd0,#8b6cf0 50%,#4a8af4);
      --shadow:-8px 0 22px rgba(212,95,208,.20), 8px 0 22px rgba(74,138,244,.20), 0 0 30px rgba(139,108,240,.14);
    }
  }
  :root[data-theme="dark"] {
    color-scheme:dark;
    --bg:#09090c; --surface:#131318; --ink:#f2f2f5; --muted:#a5a5b0;
    --line:rgba(255,255,255,.10);
    --bw:1.5px;
    --ring:linear-gradient(100deg,#d45fd0,#8b6cf0 50%,#4a8af4);
    --shadow:-8px 0 22px rgba(212,95,208,.20), 8px 0 22px rgba(74,138,244,.20), 0 0 30px rgba(139,108,240,.14);
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  button, a, input { outline:none; }
  html { background:var(--bg); }
  body {
    font-family:"Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:var(--bg); color:var(--ink); min-height:100vh;
    display:flex; justify-content:center;
    padding-top:env(safe-area-inset-top, 0px);
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  .container { width:100%; max-width:460px; padding:72px 24px 120px; text-align:center; }

  .avatar, .link, #editBtn {
    border:var(--bw) solid transparent;
    background:linear-gradient(var(--surface), var(--surface)) padding-box, var(--ring) border-box;
    box-shadow:var(--shadow);
  }

  .avatar {
    width:120px; height:120px; border-radius:50%; margin:0 auto 28px; padding:7px;
    font-size:44px; font-weight:800; color:var(--muted);
  }
  .avatar .well {
    width:100%; height:100%; border-radius:50%; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  .avatar img { width:100%; height:100%; object-fit:cover; display:block; }

  h1 { font-size:26px; font-weight:800; letter-spacing:-0.5px; }
  .bio { font-size:15px; line-height:1.6; color:var(--muted); margin:10px auto 44px; max-width:340px; font-weight:500; }

  .link {
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    border-radius:999px; padding:22px 28px; min-height:66px; margin-bottom:18px;
    text-decoration:none; color:var(--ink); font-weight:700; font-size:16px;
    transition:transform .15s ease;
  }
  .link .label { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .link .go { flex:none; display:flex; color:var(--muted); }
  .link:active { transform:scale(.98); }

  /* SLOT: blok tambahan (dukungan ala Trakteer, dll) ditaruh di sini */
  #slot-support { margin-top:8px; }
  .footer { margin-top:56px; font-size:13px; color:var(--muted); opacity:.8; }

  /* Tombol edit */
  #editBtn {
    position:fixed; right:calc(24px + env(safe-area-inset-right, 0px)); bottom:calc(24px + env(safe-area-inset-bottom, 0px));
    width:56px; height:56px; border-radius:50%; cursor:pointer; color:var(--ink);
    display:flex; align-items:center; justify-content:center; padding:0; z-index:5;
  }
  #editBtn svg { width:24px; height:24px; display:block; }

  #editPanel {
    position:fixed; inset:0; z-index:10; display:none;
    background:var(--bg); overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:calc(32px + env(safe-area-inset-top, 0px)) 24px calc(40px + env(safe-area-inset-bottom, 0px));
  }
  #editPanel.active { display:block; }
  .sheet { max-width:460px; margin:0 auto; text-align:left; }
  .sheet h2 { font-size:22px; font-weight:800; margin-bottom:8px; letter-spacing:-0.3px; }
  .sheet label { display:block; font-size:14px; font-weight:700; color:var(--muted); margin:28px 0 10px 4px; }
  .sheet input[type="text"], .sheet input[type="url"], .sheet input[type="password"] {
    width:100%; padding:17px 18px; border:1px solid var(--line); border-radius:16px;
    font:inherit; font-size:16px; font-weight:600; background:var(--surface); color:var(--ink);
  }
  .sheet input:focus { border-color:var(--muted); }
  .pic-row { display:flex; align-items:center; gap:20px; }
  .pic-row .avatar { margin:0; width:96px; height:96px; font-size:34px; padding:6px; flex:none; }
  .pic-actions { display:flex; flex-direction:column; gap:12px; align-items:flex-start; }
  .btn {
    border:1px solid var(--line); cursor:pointer; font:inherit; font-weight:700; font-size:15px; color:var(--ink);
    background:var(--surface); border-radius:999px; padding:14px 24px;
    box-shadow:0 1px 2px rgba(0,0,0,.04);
  }
  .btn:active { transform:scale(.98); }
  .btn.primary { background:var(--ink); color:var(--bg); border-color:transparent; }
  .btn.danger { color:#d14343; }
  .btn.block { width:100%; padding:18px; font-size:16px; margin-top:16px; }
  .link-edit { display:grid; grid-template-columns:1fr auto; gap:12px; margin-bottom:18px; align-items:center; }
  .link-edit .stack { display:flex; flex-direction:column; gap:12px; }
  .link-edit .btn { padding:12px 16px; }

  /* Pilihan tema */
  .seg { display:flex; gap:4px; padding:4px; border:1px solid var(--line); border-radius:999px; background:var(--surface); }
  .seg button {
    flex:1; border:none; cursor:pointer; font:inherit; font-size:15px; font-weight:700;
    padding:13px 8px; border-radius:999px; background:transparent; color:var(--muted);
  }
  .seg button.on { background:var(--ink); color:var(--bg); }

  #editBtn[hidden] { display:none; }
  #app, .footer { opacity:0; transition:opacity .25s ease; }
  body.ready #app, body.ready .footer { opacity:1; }
  .hint { font-size:13px; line-height:1.6; color:var(--muted); margin:10px 4px 0; }
  #status { font-size:14px; font-weight:600; line-height:1.5; margin:14px 4px 0; }
  #status.err { color:#d14343; }

  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<div class="container">
  <div id="app"></div>
  <div id="slot-support"></div>
  <div class="footer" id="footerText"></div>
</div>

<button id="editBtn" type="button" aria-label="Edit halaman" hidden>
  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
</button>
<div id="editPanel"></div>

<script type="application/json" id="cfg">
{"name":"@nama_lu","bio":"IG • YT • TikTok gw disini semua","avatar":"","footer":"made with minimal white","theme":"auto","links":[{"label":"Instagram","url":"https://instagram.com/"},{"label":"YouTube","url":"https://youtube.com/"},{"label":"TikTok","url":"https://tiktok.com/"}]}
</script>

<script>
(function(){
  const KEY = 'linkbio:data';
  const $ = (s, r=document) => r.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const DEFAULT = JSON.parse($('#cfg').textContent);
  let cfg = DEFAULT;
  // Dibuka dari penyimpanan HP atau localhost = mode uji (data disimpan di browser).
  // Di hosting, data diambil dari data.json di repo.
  const LOCAL = /^(file|content):$/.test(location.protocol) || /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  const GH = 'linkbio:gh', OWNER = 'linkbio:owner';
  const lsGet = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch(e){} };
  const persist = () => lsSet(KEY, JSON.stringify(cfg));

  async function load(){
    if (LOCAL) { try { const d = JSON.parse(lsGet(KEY) || 'null'); if (d) cfg = d; } catch(e){} return; }
    try {
      const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 5000);
      const r = await fetch('data.json?v=' + Date.now(), {cache:'no-store', signal:ctl.signal});
      clearTimeout(to);
      if (r.ok) cfg = Object.assign({}, DEFAULT, await r.json());
    } catch(e){}
  }

  function applyTheme(t){
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    else delete document.documentElement.dataset.theme;
  }
  const ARROW = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>';

  function safeUrl(u){
    u = String(u||'').trim();
    if (!u) return '#';
    if (/^(https?:|mailto:)/i.test(u)) return u;
    if (/^[a-z][a-z0-9+.-]*:/i.test(u)) return '#';
    return 'https://' + u;
  }

  function avatarHtml(src, name){
    const initial = (String(name||'').replace('@','').trim().charAt(0) || '✦').toUpperCase();
    return '<div class="avatar"><div class="well">' + (src ? '<img alt="" src="' + esc(src) + '">' : esc(initial)) + '</div></div>';
  }

  function render(){
    $('#app').innerHTML =
      avatarHtml(cfg.avatar, cfg.name) +
      '<h1>' + esc(cfg.name) + '</h1>' +
      '<p class="bio">' + esc(cfg.bio) + '</p>' +
      cfg.links.filter(l => l.label || l.url).map(l =>
        '<a class="link" target="_blank" rel="noopener noreferrer" href="' + esc(safeUrl(l.url)) + '"><span class="label">' + esc(l.label || l.url) + '</span><span class="go">' + ARROW + '</span></a>'
      ).join('');
    $('#footerText').textContent = cfg.footer || '';
    document.title = String(cfg.name || 'Link').replace(/^@/, '');
  }

  // ===== Edit =====
  let draft = null;
  const panel = $('#editPanel');

  function guessRepo(){
    const h = location.hostname;
    if (!h.endsWith('.github.io')) return '';
    const user = h.split('.')[0], seg = location.pathname.split('/').filter(Boolean)[0];
    return user + '/' + (seg && !/\.html?$/i.test(seg) ? seg : user + '.github.io');
  }
  let gh = {repo: guessRepo(), token: ''};
  try { gh = Object.assign(gh, JSON.parse(lsGet(GH) || '{}')); } catch(e){}

  const b64 = s => btoa(unescape(encodeURIComponent(s)));
  async function publish(data){
    const url = 'https://api.github.com/repos/' + gh.repo + '/contents/data.json';
    const H = {Authorization:'Bearer ' + gh.token, Accept:'application/vnd.github+json'};
    let sha;
    const g = await fetch(url, {headers:H, cache:'no-store'});
    if (g.ok) sha = (await g.json()).sha; else if (g.status !== 404) throw new Error(String(g.status));
    const body = {message:'Update halaman link', content:b64(JSON.stringify(data, null, 2))};
    if (sha) body.sha = sha;
    const p = await fetch(url, {method:'PUT', headers:Object.assign({'Content-Type':'application/json'}, H), body:JSON.stringify(body)});
    if (!p.ok) throw new Error(String(p.status));
  }

  // Dilakukan sekali oleh pemasang halaman (alamat situs + #setup)
  function openSetup(){
    panel.innerHTML =
      '<div class="sheet">' +
        '<h2>Setel publikasi</h2>' +
        '<p class="hint">Cukup sekali. Setelah ini, edit lewat tombol titik 3 langsung terpublikasi.</p>' +
        '<label for="ghRepo">Repo GitHub</label>' +
        '<input type="text" id="ghRepo" placeholder="username/nama-repo" autocapitalize="off" autocorrect="off" spellcheck="false" value="' + esc(gh.repo) + '">' +
        '<label for="ghToken">Token GitHub</label>' +
        '<input type="password" id="ghToken" placeholder="Tempel token" autocomplete="off" value="' + esc(gh.token) + '">' +
        '<p class="hint">Token hanya disimpan di HP ini dan tidak ikut ke repo.</p>' +
        '<p id="status"></p>' +
        '<button class="btn primary block" type="button" id="setupSave">Simpan</button>' +
        '<button class="btn block" type="button" id="setupClose">Tutup</button>' +
      '</div>';
    panel.classList.add('active'); panel.scrollTop = 0;
    $('#setupClose').onclick = () => panel.classList.remove('active');
    $('#setupSave').onclick = async () => {
      const status = $('#status'), say = (t, err) => { status.textContent = t; status.className = err ? 'err' : ''; };
      gh.repo = $('#ghRepo').value.trim().replace(/^\/+|\/+$/g, '');
      gh.token = $('#ghToken').value.trim();
      if (!/^[\w.-]+\/[\w.-]+$/.test(gh.repo) || !gh.token) { say('Isi nama repo (username/nama-repo) dan tokennya.', true); return; }
      say('Memeriksa koneksi…');
      try {
        const r = await fetch('https://api.github.com/repos/' + gh.repo, {headers:{Authorization:'Bearer ' + gh.token, Accept:'application/vnd.github+json'}});
        if (!r.ok) throw new Error(String(r.status));
      } catch(e) {
        say(['401','403','404'].includes(e.message) ? 'Repo atau token tidak cocok. Cek lagi nama repo dan izin token.' : 'Gagal terhubung. Cek koneksi lalu coba lagi.', true);
        return;
      }
      lsSet(GH, JSON.stringify(gh));
      panel.classList.remove('active');
      alert('Tersambung. Sekarang halaman bisa diedit lewat tombol titik 3 dan langsung terpublikasi.');
    };
  }

  async function save(){
    sync();
    const status = $('#status'), btn = $('#saveBtn');
    const say = (t, err) => { status.textContent = t; status.className = err ? 'err' : ''; };
    if (!LOCAL) {
      if (!/^[\w.-]+\/[\w.-]+$/.test(gh.repo || '') || !gh.token) { say('Halaman ini belum disambungkan untuk publikasi. Minta yang memasangnya membuka alamat situs dengan #setup.', true); return; }
      btn.disabled = true; say('Mempublikasikan…');
      try { await publish(draft); }
      catch(e){
        btn.disabled = false;
        const c = e.message;
        say(c === '401' || c === '403' || c === '404' ? 'Izin publikasi tidak berlaku lagi. Minta yang memasang halaman ini menyetel ulang lewat #setup.'
          : 'Gagal mempublikasikan. Cek koneksi lalu coba lagi.', true);
        return;
      }
    }
    cfg = JSON.parse(JSON.stringify(draft));
    if (LOCAL) persist();
    lsSet('linkbio:theme', cfg.theme || 'auto');
    applyTheme(cfg.theme); render(); panel.classList.remove('active');
    if (!LOCAL) alert('Terpublikasi. Perubahan muncul di situs sekitar 1 menit.');
  }

  $('#editBtn').onclick = () => {
    draft = JSON.parse(JSON.stringify(cfg));
    drawPanel();
    panel.classList.add('active');
    panel.scrollTop = 0;
  };

  function closePanel(){ applyTheme(cfg.theme); panel.classList.remove('active'); }

  function drawPanel(){
    const themes = [['auto','Otomatis'],['light','Terang'],['dark','Gelap']];
    panel.innerHTML =
      '<div class="sheet">' +
        '<h2>Edit halaman</h2>' +
        '<label>Foto profil</label>' +
        '<div class="pic-row">' + avatarHtml(draft.avatar, draft.name) +
          '<div class="pic-actions">' +
            '<button class="btn" type="button" id="pickPic">Ganti foto</button>' +
            '<button class="btn danger" type="button" id="delPic">Hapus foto</button>' +
          '</div>' +
          '<input type="file" id="picFile" accept="image/*" hidden>' +
        '</div>' +
        '<label>Tampilan</label>' +
        '<div class="seg" id="seg">' + themes.map(t =>
          '<button type="button" data-t="' + t[0] + '" class="' + ((draft.theme || 'auto') === t[0] ? 'on' : '') + '">' + t[1] + '</button>'
        ).join('') + '</div>' +
        '<label for="inName">Nama</label><input type="text" id="inName" value="' + esc(draft.name) + '">' +
        '<label for="inBio">Bio</label><input type="text" id="inBio" value="' + esc(draft.bio) + '">' +
        '<label>Link</label><div id="linkList"></div>' +
        '<button class="btn" type="button" id="addLink">Tambah link</button>' +
        '<p id="status"></p>' +
        '<button class="btn primary block" type="button" id="saveBtn">Simpan</button>' +
        '<button class="btn block" type="button" id="closeBtn">Batal</button>' +
      '</div>';

    const box = $('#linkList');
    draft.links.forEach((l, i) => {
      const row = document.createElement('div');
      row.className = 'link-edit';
      row.innerHTML =
        '<div class="stack">' +
          '<input type="text" data-k="label" data-i="' + i + '" placeholder="Nama tombol" value="' + esc(l.label) + '">' +
          '<input type="url" data-k="url" data-i="' + i + '" placeholder="https://" value="' + esc(l.url) + '">' +
        '</div>' +
        '<button class="btn danger" type="button" data-del="' + i + '">Hapus</button>';
      box.appendChild(row);
    });
    box.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { sync(); draft.links.splice(+b.dataset.del, 1); drawPanel(); });

    $('#seg').querySelectorAll('button').forEach(b => b.onclick = () => {
      draft.theme = b.dataset.t; applyTheme(draft.theme);
      $('#seg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    });

    $('#pickPic').onclick = () => $('#picFile').click();
    $('#picFile').onchange = e => { const f = e.target.files[0]; if (f) readPhoto(f); };
    $('#delPic').onclick = () => { sync(); draft.avatar = ''; drawPanel(); };
    $('#addLink').onclick = () => { sync(); draft.links.push({label:'', url:''}); drawPanel(); };
    $('#saveBtn').onclick = save;
    $('#closeBtn').onclick = closePanel;
  }

  function sync(){
    draft.name = $('#inName').value;
    draft.bio = $('#inBio').value;
    panel.querySelectorAll('#linkList input').forEach(inp => { draft.links[+inp.dataset.i][inp.dataset.k] = inp.value; });
  }

  // Foto dipotong persegi dan dikecilkan supaya ringan
  function readPhoto(file){
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const S = 320, side = Math.min(img.width, img.height);
        const c = document.createElement('canvas'); c.width = c.height = S;
        c.getContext('2d').drawImage(img, (img.width - side)/2, (img.height - side)/2, side, side, 0, 0, S, S);
        sync();
        draft.avatar = c.toDataURL('image/jpeg', 0.86);
        drawPanel();
      };
      img.onerror = () => alert('File ini tidak bisa dibaca sebagai gambar.');
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  // Tombol edit tersembunyi di hosting. Muncul setelah alamat situs dibuka dengan #setup.
  const showEditBtn = () => { $('#editBtn').hidden = false; };
  if (LOCAL || lsGet(OWNER) === '1') showEditBtn();
  const checkHash = () => {
    if (location.hash !== '#setup') return;
    lsSet(OWNER, '1'); showEditBtn(); openSetup();
    try { history.replaceState(null, '', location.pathname + location.search); } catch(e){}
  };
  window.addEventListener('hashchange', checkHash);
  checkHash();

  load().then(() => {
    lsSet('linkbio:theme', cfg.theme || 'auto');
    applyTheme(cfg.theme); render(); document.body.classList.add('ready');
  });
})();
</script>
</body>
</html>
